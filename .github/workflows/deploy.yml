# Publishes luizkim.com to Cloudflare Pages on every push to main.
#
# Two jobs: a secret scan over the full history, then the deploy. The deploy
# only runs if the scan passes. Every action is pinned to a commit hash so a
# moved tag cannot change what runs here; Dependabot opens a PR when a newer
# release exists.
#
# Secrets this workflow needs (repository Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   a token whose only permission is "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Cloudflare dashboard
# See DEPLOY.md.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing in this workflow writes to the repository.
permissions: {}

# One deploy at a time, in order; a newer push waits for the current one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Pages
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://luizkim.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dist/
        run: python3 scripts/build.py

      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          command: pages deploy dist --project-name=luizkim-com --branch=main --commit-dirty=true
